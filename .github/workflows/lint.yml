name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          # ponytail: bun 1.4.0 (2026-08-20) breaks relay-reconnect tests; pin until upstream fix
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run Lint
        run: bun lint

      - name: Run Type Check
        run: bun typecheck

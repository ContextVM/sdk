name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup minimum Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          NWC_INTEGRATION: 'false'
          LNBITS_INTEGRATION: 'false'
          ZAP_INTEGRATION: 'false'
          NODE_ENV: test
        run: bun test --concurrent --timeout=60000

      - name: Check types and lint
        run: |
          bun run typecheck
          bun run lint

      - name: Build and check public exports
        run: |
          bun run build
          bun run verify-exports

      - name: Qualify Node 18 and browser entrypoints
        run: |
          bun run verify:payment-runtime
          bun run verify:browser

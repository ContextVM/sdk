name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          # TODO: revert to `latest` once bun >1.4.0 ships the ws-upgrade fix
          # (oven-sh/bun#39766, fixed by oven-sh/bun#39642). 1.4.0 breaks the
          # relay reconnection tests' `server.upgrade()` after macrotasks.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run tests
        env:
          NODE_ENV: test
        run: bun test --concurrent --timeout=60000
